<style>
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0; }
  .bar h1 { font-size: 20px; margin: 0; }
  .bar nav { display: flex; gap: 8px; align-items: center; }
  .bar nav a, .bar nav button { font-size: 14px; padding: 8px 12px; color: var(--muted); }
  .bar form { margin: 0; }

  .add { display: grid; gap: 10px; }
  .add textarea { min-height: 56px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .score { display: flex; align-items: stretch; }
  .score input { width: 52px; text-align: center; border-radius: 0; border-left: 0; border-right: 0; padding: 12px 4px; }
  .score button { padding: 0 12px; }
  .score button:first-child { border-radius: 10px 0 0 10px; }
  .score button:last-child { border-radius: 0 10px 10px 0; }
  .row .grow { flex: 1; }
  .row button { white-space: nowrap; }
  .add .row > button { padding: 12px 14px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }

  .ac-wrap { position: relative; }
  .ac { list-style: none; margin: 4px 0 0; padding: 4px; position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px #000a; }
  .ac li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .ac li.active, .ac li:hover { background: var(--surface-2); }
  .ac img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
  .ac .meta { flex: 1; min-width: 0; }
  .ac .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac .tag { font-size: 12px; color: var(--muted); flex: none; }
  .ac .msg { color: var(--muted); font-size: 14px; cursor: default; }
  .ac .msg:hover { background: none; }

  .log { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 4px; font-size: 14px; }
  .log .ok { color: var(--ok); }
  .log .bad { color: var(--err); }

  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 28px 0 8px; }
  h2 small { font-weight: 400; }
  .items { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .item { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .item .note { flex: 1 0 100%; min-height: 0; padding: 8px 10px; font-size: 15px; resize: none; overflow: hidden; }
  .item .note[hidden] { display: none; }
  .item .note.saved { outline: 2px solid var(--ok); }
  .item .icon { padding: 8px 10px; color: var(--muted); flex: none; }
  .item .icon.on { color: var(--text); }
  #note { min-height: 0; resize: none; overflow: hidden; }
  .item img { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex: none; }
  .item.ch img { width: 40px; height: 40px; border-radius: 50%; margin: 0 12px; }
  .item .meta { flex: 1 1 0; min-width: 0; }
  .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item input { width: 64px; padding: 8px 4px; text-align: center; flex: none; }
  .item input.saved { outline: 2px solid var(--ok); }
  .pad { height: 40px; }
</style>

<main>
  <div class="bar">
    <h1>Edit</h1>
    <nav>
      <a href="/">View site</a>
      <form method="post" action="/edit/logout"><button type="submit">Sign out</button></form>
    </nav>
  </div>

  <form class="add" id="add">
    <div class="ac-wrap">
      <textarea id="text" placeholder="Paste YouTube links, or type @name to find a channel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <ul class="ac" id="ac" role="listbox" hidden></ul>
    </div>
    <textarea id="note" rows="1" placeholder="Note for videos (optional)" maxlength="2000"></textarea>
    <div class="row">
      <div class="score">
        <button type="button" data-step="-5" aria-label="Score minus 5">−</button>
        <input id="score" type="number" inputmode="numeric" min="0" max="100" value="80" aria-label="Score">
        <button type="button" data-step="5" aria-label="Score plus 5">+</button>
      </div>
      <button type="button" id="paste" class="grow">Paste</button>
      <button type="submit" class="primary" id="submit">Add</button>
    </div>
    <p class="hint">Pasting a link into the box adds it right away. Type @name to search channels. Set the score and note before pasting. Re-adding an existing item updates it.</p>
    <ul class="log" id="log"></ul>
  </form>

  <h2>Channels <small id="ccount"></small></h2>
  <ul class="items" id="channels"></ul>

  <h2>Videos <small id="vcount"></small></h2>
  <ul class="items" id="videos"></ul>
  <div class="pad"></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const text = $('text'), score = $('score'), log = $('log'), submit = $('submit'), noteBox = $('note');
  let busy = false;

  const api = async (method, url, body) => {
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) { location.reload(); throw new Error('signed out'); }
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };

  const clamp = (n) => Math.max(0, Math.min(100, Math.round(Number(n)) || 0));

  document.querySelectorAll('[data-step]').forEach((b) =>
    b.addEventListener('click', () => { score.value = clamp(Number(score.value) + Number(b.dataset.step)); }));

  function el(tag, props = {}, ...kids) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  }

  function renderList(kind, items) {
    const ul = $(kind);
    ul.replaceChildren(...items.map((it) => {
      const isCh = kind === 'channels';
      const input = el('input', { type: 'number', inputMode: 'numeric', min: 0, max: 100, value: it.score });
      input.setAttribute('aria-label', 'Score');
      input.addEventListener('change', async () => {
        input.value = clamp(input.value);
        try {
          // Save without re-sorting, so rows don't jump while arrowing through scores.
          // The new order shows up after the next add/delete or reload.
          await api('PATCH', `/api/${kind}/${it.id}`, { score: Number(input.value) });
          it.score = Number(input.value);
          input.classList.add('saved');
          setTimeout(() => input.classList.remove('saved'), 800);
        } catch (e) { alert(e.message); }
      });
      const del = el('button', { type: 'button', className: 'icon', textContent: '✕', title: 'Delete' });
      del.addEventListener('click', async () => {
        if (!confirm(`Delete “${isCh ? it.name : it.title}”?`)) return;
        try { await api('DELETE', `/api/${kind}/${it.id}`); load(); } catch (e) { alert(e.message); }
      });
      const href = isCh ? it.url : `https://www.youtube.com/watch?v=${it.id}`;
      return el('li', { className: 'item' + (isCh ? ' ch' : '') },
        el('a', { href, target: '_blank', rel: 'noopener' }, el('img', { src: isCh ? it.avatar : it.thumbnail, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' })),
        el('div', { className: 'meta' },
          el('div', { className: 't', textContent: isCh ? it.name : it.title }),
          el('div', { className: 's', textContent: isCh ? (it.handle || it.id) : it.channelName })),
        input, ...(isCh ? [del] : noteControls(it, del)));
    }));
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 2 + 'px';
  }

  function noteControls(it, del) {
    const ta = el('textarea', { className: 'note', rows: 1, maxLength: 2000, placeholder: 'Note (shown under the video)', value: it.note || '' });
    ta.hidden = !it.note;
    const btn = el('button', { type: 'button', className: 'icon' + (it.note ? ' on' : ''), textContent: '✎', title: 'Note' });
    btn.addEventListener('click', () => {
      ta.hidden = false;
      autoGrow(ta);
      ta.focus();
    });
    ta.addEventListener('input', () => autoGrow(ta));
    ta.addEventListener('change', async () => {
      try {
        const saved = await api('PATCH', `/api/videos/${it.id}`, { note: ta.value });
        it.note = saved.note;
        ta.value = saved.note;
        btn.classList.toggle('on', !!saved.note);
        ta.classList.add('saved');
        setTimeout(() => ta.classList.remove('saved'), 800);
      } catch (e) { alert(e.message); }
    });
    ta.addEventListener('blur', () => { if (!ta.value.trim()) ta.hidden = true; });
    requestAnimationFrame(() => autoGrow(ta));
    return [btn, del, ta];
  }

  async function load() {
    const data = await api('GET', '/api/items');
    renderList('channels', data.channels);
    renderList('videos', data.videos);
    $('ccount').textContent = data.channels.length ? `(${data.channels.length})` : '';
    $('vcount').textContent = data.videos.length ? `(${data.videos.length})` : '';
  }

  async function add(raw) {
    if (busy || !raw.trim()) return;
    busy = true;
    submit.disabled = true;
    submit.textContent = 'Adding…';
    try {
      const { results } = await api('POST', '/api/items', { text: raw, score: clamp(score.value), note: noteBox.value });
      const failed = [];
      for (const r of results) {
        const msg = r.ok
          ? `${r.updated ? 'Updated' : 'Added'} ${r.type}: ${r.title} (${clamp(score.value)})`
          : `${r.input} — ${r.error}`;
        log.prepend(el('li', { className: r.ok ? 'ok' : 'bad', textContent: (r.ok ? '✓ ' : '✗ ') + msg }));
        if (!r.ok) failed.push(r.input);
      }
      while (log.children.length > 8) log.lastChild.remove();
      text.value = failed.join('\n');
      if (!failed.length) { noteBox.value = ''; autoGrow(noteBox); }
      await load();
    } catch (e) {
      log.prepend(el('li', { className: 'bad', textContent: '✗ ' + e.message }));
    } finally {
      busy = false;
      submit.disabled = false;
      submit.textContent = 'Add';
    }
  }

  $('add').addEventListener('submit', (e) => { e.preventDefault(); hideAc(); add(text.value); });

  noteBox.addEventListener('input', () => autoGrow(noteBox));

  // ---- @channel autocomplete ----
  const ac = $('ac');
  let acItems = [], acIndex = -1, acTimer = null, acSeq = 0;

  function hideAc() {
    clearTimeout(acTimer);
    acSeq++;
    ac.hidden = true;
    acItems = [];
    acIndex = -1;
  }

  function acMessage(msg) {
    acItems = [];
    acIndex = -1;
    ac.replaceChildren(el('li', { className: 'msg', textContent: msg }));
    ac.hidden = false;
  }

  function renderAc() {
    if (!acItems.length) return acMessage('No channels found');
    ac.replaceChildren(...acItems.map((c, i) => {
      const li = el('li', { className: i === acIndex ? 'active' : '', role: 'option' },
        el('img', { src: c.avatar, alt: '', referrerPolicy: 'no-referrer' }),
        el('div', { className: 'meta' },
          el('div', { className: 't', textContent: c.name }),
          el('div', { className: 's', textContent: [c.handle, c.subs].filter(Boolean).join(' · ') })),
        c.score !== null ? el('span', { className: 'tag', textContent: `added · ${c.score}` }) : '');
      // pointerdown + preventDefault keeps focus in the textarea (no keyboard flicker on mobile).
      li.addEventListener('pointerdown', (e) => { e.preventDefault(); pickAc(i); });
      return li;
    }));
    ac.hidden = false;
  }

  function pickAc(i) {
    const c = acItems[i];
    if (!c) return;
    hideAc();
    text.value = 'https://www.youtube.com' + c.path;
    add(text.value);
  }

  text.addEventListener('input', () => {
    const m = text.value.trim().match(/^@(\S{2,})$/);
    if (!m || /youtu\.?be/i.test(m[1])) return hideAc();
    clearTimeout(acTimer);
    const seq = ++acSeq;
    acTimer = setTimeout(async () => {
      if (ac.hidden) acMessage('Searching…');
      try {
        const { results } = await api('GET', '/api/search-channels?q=' + encodeURIComponent(m[1]));
        if (seq !== acSeq) return;
        acItems = results;
        acIndex = results.length ? 0 : -1;
        renderAc();
      } catch (e) {
        if (seq === acSeq) acMessage('Search failed: ' + e.message);
      }
    }, 300);
  });

  text.addEventListener('keydown', (e) => {
    if (ac.hidden) return;
    if (e.key === 'Escape') { hideAc(); return; }
    if (!acItems.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      acIndex = (acIndex + (e.key === 'ArrowDown' ? 1 : -1) + acItems.length) % acItems.length;
      renderAc();
    } else if (e.key === 'Enter' && acIndex >= 0) {
      e.preventDefault();
      pickAc(acIndex);
    }
  });

  text.addEventListener('blur', () => setTimeout(hideAc, 150));

  // Pasting a link into the empty box submits immediately.
  text.addEventListener('paste', (e) => {
    const pasted = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (text.value.trim() === '' && /youtu\.?be/i.test(pasted)) {
      e.preventDefault();
      text.value = pasted;
      add(pasted);
    }
  });

  const pasteBtn = $('paste');
  if (!navigator.clipboard?.readText) pasteBtn.hidden = true;
  pasteBtn.addEventListener('click', async () => {
    try {
      const clip = await navigator.clipboard.readText();
      if (!clip.trim()) return;
      text.value = clip;
      add(clip);
    } catch {
      text.focus();
    }
  });

  load();
})();
</script>
